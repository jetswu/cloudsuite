# Bulwark Webmail (CloudSuite staging) -- Sprint 0.10b
# Reverse proxy ke Bulwark webmail di port 3000

server {
    listen 443 ssl;
    server_name webmail.idchsuite.my.id;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;

    client_max_body_size 50M;

    resolver 127.0.0.11 valid=30s;
    set $bulwark_upstream http://bulwark:3000;

    location / {
        proxy_pass $bulwark_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
